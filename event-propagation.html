<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOM — Event Propagation</title>
  <style>
    * { margin: 0; box-sizing: border-box; }

    body { font-family: sans-serif; padding: 30px; }

    h2 { margin-bottom: 12px; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }

    .controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .btn-clear {
      padding: 6px 14px;
      background: #555;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Nested boxes */
    .box {
      display: grid;
      place-items: center;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      color: white;
    }

    .box--outer  { width: 440px; height: 440px; background: #1a237e; }
    .box--child1 { width: 82%; height: 82%; background: #1565c0; }
    .box--child2 { width: 82%; height: 82%; background: #2e7d32; }
    .box--child3 { width: 82%; height: 82%; background: #424242; }
    .box--inner  { width: 62%; height: 62%; background: #f5f5f5; color: #333; border-radius: 4px; }

    /* Log */
    .log {
      margin-top: 16px;
      padding: 10px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 6px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 0.82rem;
      font-family: monospace;
    }

    .log__entry--capture { color: #1565c0; }
    .log__entry--bubble  { color: #c62828; }
  </style>
</head>
<body>

  <h2>Event Propagation</h2>

  <div class="controls">
    <label>
      <input type="radio" name="phase" id="radioBubble" value="bubble" checked />
      Bubble (target → top)
    </label>
    <label>
      <input type="radio" name="phase" id="radioCapture" value="capture" />
      Capture (top → target)
    </label>
    <label>
      <input type="checkbox" id="stopPropCheck" />
      Stop propagation at target
    </label>
    <button class="btn-clear" id="clearLogBtn">Clear log</button>
  </div>

  <div class="box box--outer"  id="boxOuter">  Outer
    <div class="box box--child1" id="boxChild1">Child 1
      <div class="box box--child2" id="boxChild2">Child 2
        <div class="box box--child3" id="boxChild3">Child 3
          <div class="box box--inner" id="boxInner">Click me</div>
        </div>
      </div>
    </div>
  </div>

  <div class="log" id="eventLog"></div>

  <script>
    const BOXES = [
      { id: 'boxOuter',  label: 'Outer'   },
      { id: 'boxChild1', label: 'Child 1' },
      { id: 'boxChild2', label: 'Child 2' },
      { id: 'boxChild3', label: 'Child 3' },
      { id: 'boxInner',  label: 'Inner'   },
    ];

    const eventLog      = document.getElementById('eventLog');
    const stopPropCheck = document.getElementById('stopPropCheck');
    const clearLogBtn   = document.getElementById('clearLogBtn');
    const radioBubble   = document.getElementById('radioBubble');
    const radioCapture  = document.getElementById('radioCapture');

    let activeListeners = [];

    /** Appends a line to the on-screen log. */
    function logEntry(text, phase) {
      const div = document.createElement('div');
      div.className   = `log__entry--${phase}`;
      div.textContent = text;
      eventLog.appendChild(div);
      eventLog.scrollTop = eventLog.scrollHeight;
    }

    /** Removes all active listeners then re-registers them for the chosen phase. */
    function rebindListeners() {
      activeListeners.forEach(({ el, fn, useCapture }) =>
        el.removeEventListener('click', fn, useCapture)
      );
      activeListeners = [];

      const useCapture = radioCapture.checked;
      const phase      = useCapture ? 'capture' : 'bubble';

      BOXES.forEach(({ id, label }) => {
        const el      = document.getElementById(id);
        const handler = (event) => {
          logEntry(`${label} — [${phase}]`, phase);
          if (stopPropCheck.checked) {
            event.stopPropagation();
            logEntry(`  ↳ propagation stopped at ${label}`, phase);
          }
        };
        el.addEventListener('click', handler, useCapture);
        activeListeners.push({ el, fn: handler, useCapture });
      });
    }

    radioBubble.addEventListener('change',  rebindListeners);
    radioCapture.addEventListener('change', rebindListeners);
    clearLogBtn.addEventListener('click',   () => { eventLog.innerHTML = ''; });

    rebindListeners(); // initial bind
  </script>

</body>
</html>
