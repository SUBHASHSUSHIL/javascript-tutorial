<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOM — Mouse Events</title>
  <style>
    * { margin: 0; box-sizing: border-box; }

    body {
      font-family: sans-serif;
      padding: 30px;
    }

    h2 { margin-bottom: 16px; }

    .event-box {
      width: 50vw;
      height: 50vh;
      display: grid;
      place-items: center;
      background-color: rgb(201, 192, 179);
      color: navy;
      font-size: 1.8rem;
      font-weight: bold;
      border-radius: 8px;
      transition: background-color 0.15s;
      cursor: pointer;
      user-select: none;
    }

    .event-log {
      margin-top: 20px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #333;
      min-height: 40px;
    }

    .event-log span { font-weight: bold; color: navy; }
  </style>
</head>
<body>

  <h2>Mouse Events Demo</h2>
  <div class="event-box" id="eventBox">No event yet</div>
  <div class="event-log" id="eventLog">Interact with the box above…</div>

  <script>
    /**
     * Each entry maps a DOM event name to a display label and theme colour.
     * @type {Array<{event: string, label: string, bg: string, color: string}>}
     */
    const EVENT_CONFIG = [
      { event: 'mouseover',  label: 'mouseover',   bg: '#111111', color: 'white'  },
      { event: 'mouseenter', label: 'mouseenter',  bg: '#cc0000', color: 'white'  },
      { event: 'mousedown',  label: 'mousedown',   bg: '#cc00cc', color: 'white'  },
      { event: 'mouseup',    label: 'mouseup',     bg: '#007700', color: 'white'  },
      { event: 'click',      label: 'click',       bg: 'navy',    color: 'white'  },
      { event: 'dblclick',   label: 'dblclick',    bg: '#00bcd4', color: 'navy'   },
      { event: 'mousemove',  label: 'mousemove',   bg: '#333333', color: 'white'  },
      { event: 'wheel',      label: 'wheel',       bg: '#00897b', color: 'white'  },
      { event: 'mouseout',   label: 'mouseout',    bg: '#e64a19', color: 'white'  },
      { event: 'mouseleave', label: 'mouseleave',  bg: '#6a1b9a', color: 'white'  },
    ];

    const eventBox = document.getElementById('eventBox');
    const eventLog = document.getElementById('eventLog');

    EVENT_CONFIG.forEach(({ event, label, bg, color }) => {
      eventBox.addEventListener(event, () => {
        eventBox.style.backgroundColor = bg;
        eventBox.style.color           = color;
        eventBox.textContent           = label;
        eventLog.innerHTML             = `Last event: <span>${label}</span>`;
      });
    });
  </script>

</body>
</html>
